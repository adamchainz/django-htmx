# The database servers for the tests, on non-default ports so they don't
# clash with any local installation. Start them with:
#
#   docker compose up -d --wait

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
    - 127.0.0.1:55432:5432
    healthcheck:
      test: [CMD, pg_isready, --username, postgres]
      interval: 2s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:26.10
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
    - 127.0.0.1:53306:3306
    healthcheck:
      test: [CMD, mysqladmin, ping, --host=127.0.0.1, --user=root, --password=mysql]
      interval: 2s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:13.0
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
    ports:
    - 127.0.0.1:53307:3306
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 30
